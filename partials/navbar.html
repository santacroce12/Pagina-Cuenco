              name="empresa"
              placeholder="Empresa o institucion"
            />
          </div>
          <div class="mb-3">
            <label for="modal-email" class="form-label">Tu email</label>

              id="modal-email"

              placeholder="ejemplo@correo.com"

            />

              >Mensaje (minimo 20 caracteres)</label
            >

              class="form-control"
              id="modal-mensaje"
              name="mensaje"

              placeholder="Contanos brevemente tu consulta..."
